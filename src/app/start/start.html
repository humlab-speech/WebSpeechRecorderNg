<section class="spr-start">
  <span class="spr-start-badge">Umeå University · SpeechRecorder</span>
  <h1 class="spr-start-title">Record speech,<br>against scripted prompts.</h1>
  <p class="spr-start-lead">
    SpeechRecorderNg runs a recording session in the browser: it presents the prompts of

    with its metadata.
  </p>
  <div class="spr-start-actions">
    <a mat-raised-button class="spr-start-cta" routerLink="/spr">Open the recorder</a>
  </div>
</section>
