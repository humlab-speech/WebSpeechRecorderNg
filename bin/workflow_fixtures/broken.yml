# rule the check states, and the server job's sensitivity step requires every message below. There is no
# top-level `name:` or `on:` here, on purpose.
jobs:
  planted-no-runs-on:
    steps:
      - run: echo ok
  planted-unknown-job-key:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
    image: ubuntu
  planted-no-steps:
    runs-on: ubuntu-latest
  planted-run-without-a-command:
