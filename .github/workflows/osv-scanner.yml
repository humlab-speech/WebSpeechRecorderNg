# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "master" ]
  merge_group:
    branches: [ "master" ]
  schedule:
    - cron: '34 14 * * 0'
  push:
    branches: [ "master" ]

permissions:
  # v2's reusable workflow declares `actions: read` for itself (it reads the scan artifacts back to
  # build the SARIF), and a called workflow cannot exceed what the caller grants - without this the
  # run is refused at startup rather than in a job.
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    # No `scan-args` override: the default is `-r ./`, and the `--skip-git` this used to pass (copied
    # from upstream's v1.7.1 sample) is not a flag in the v2 scanner - it fails the scan with
    # "Incorrect Usage: flag provided but not defined: -skip-git" and no results file is written.
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc" # v2.6.0
    # No `scan-args` override: the default is `-r ./`, and the `--skip-git` this used to pass (copied
    # from upstream's v1.7.1 sample) is not a flag in the v2 scanner - it fails the scan with
    # "Incorrect Usage: flag provided but not defined: -skip-git" and no results file is written.
